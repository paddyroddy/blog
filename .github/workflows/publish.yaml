---
name: Quarto Publish

on:
  push:
    branches:
      - main
      - renovate/**
  pull_request:

jobs:
  build-and-deploy:
    permissions:
      contents: write
    runs-on: ubuntu-slim
    steps:
      # yamllint disable-line rule:line-length
      - uses: paddyroddy/.github/actions/github-pages/quarto@d8b5e17744d755a47bf422892762841f313f3dfe # v0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
